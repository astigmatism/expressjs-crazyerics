      <stop offset="0.58" stop-color="#352114"/>
      <stop offset="1" stop-color="#170e08"/>
    </linearGradient>
    <linearGradient id="frontLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#926941"/>
      <stop offset="0.36" stop-color="#59371f"/>
      <stop offset="1" stop-color="#150c07"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0" y1="0" x2="0" y2="1">
