<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 206" preserveAspectRatio="none" role="img" aria-label="Dark wooden display shelf">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162330"/>
      <stop offset="0.42" stop-color="#101923"/>
      <stop offset="0.78" stop-color="#090e14"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <radialGradient id="backGlow" cx="50%" cy="20%" r="78%">
      <stop offset="0" stop-color="#6f879f" stop-opacity="0.14"/>
      <stop offset="0.46" stop-color="#24384a" stop-opacity="0.065"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
