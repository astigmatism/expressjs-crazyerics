<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 206" preserveAspectRatio="none" role="img" aria-label="Medium-back dark wooden magazine-rack display shelf">
  <defs>
    <linearGradient id="shadowBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182736"/>
      <stop offset="0.48" stop-color="#101a24"/>
      <stop offset="0.82" stop-color="#080d13"/>
      <stop offset="1" stop-color="#04070a"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="14%" r="76%">
      <stop offset="0" stop-color="#90aeca" stop-opacity="0.12"/>
      <stop offset="0.42" stop-color="#34495b" stop-opacity="0.065"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backBoard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e4b31"/>
      <stop offset="0.18" stop-color="#563820"/>
      <stop offset="0.54" stop-color="#2e1c10"/>
      <stop offset="1" stop-color="#110905"/>
    </linearGradient>
    <linearGradient id="backBoardSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0be81" stop-opacity="0.18"/>
      <stop offset="0.20" stop-color="#8d6540" stop-opacity="0.09"/>
      <stop offset="0.70" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="topRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d09a62" stop-opacity="0.60"/>
      <stop offset="0.38" stop-color="#644026" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#120a05" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="leanStop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6a56b" stop-opacity="0.38"/>
      <stop offset="0.35" stop-color="#5c3a21" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#0b0603" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a603c"/>
      <stop offset="0.22" stop-color="#624027"/>
      <stop offset="0.58" stop-color="#352114"/>
      <stop offset="1" stop-color="#150c07"/>
    </linearGradient>
    <linearGradient id="frontLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d7147"/>
      <stop offset="0.22" stop-color="#704929"/>
      <stop offset="0.62" stop-color="#351f11"/>
      <stop offset="1" stop-color="#110904"/>
    </linearGradient>
    <linearGradient id="frontEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0bd7d" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#634126" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="horizontalGrain" width="260" height="54" patternUnits="userSpaceOnUse">
      <path d="M-6 8 C38 0 76 14 127 8 S215 5 266 13" fill="none" stroke="#d3a06b" stroke-opacity="0.12" stroke-width="1.25"/>
      <path d="M0 23 C41 15 75 29 123 23 S211 17 260 28" fill="none" stroke="#1c0f07" stroke-opacity="0.31" stroke-width="1.15"/>
      <path d="M20 39 C62 31 96 45 143 38 S218 36 262 43" fill="none" stroke="#bc875a" stroke-opacity="0.12" stroke-width="1"/>
      <path d="M66 17 C80 11 98 12 111 19 C96 23 80 23 66 17Z" fill="#120905" opacity="0.12"/>
      <path d="M161 34 C177 27 195 29 211 36 C193 40 176 40 161 34Z" fill="#d0a06d" opacity="0.055"/>
    </pattern>
    <filter id="softBlur" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1260" height="206" fill="url(#shadowBack)"/>
  <rect width="1260" height="140" fill="url(#ambientGlow)"/>
  <rect x="0" y="0" width="1260" height="1" fill="#d6e7f5" opacity="0.11"/>

  <rect x="0" y="70" width="1260" height="94" fill="url(#backBoard)" opacity="0.88"/>
  <rect x="0" y="70" width="1260" height="94" fill="url(#horizontalGrain)" opacity="0.74"/>
  <rect x="0" y="70" width="1260" height="94" fill="url(#backBoardSheen)"/>
  <ellipse cx="630" cy="76" rx="610" ry="26" fill="#ffffff" opacity="0.025" filter="url(#softBlur)"/>

  <rect x="0" y="69" width="1260" height="8" fill="url(#topRail)"/>
  <rect x="0" y="69" width="1260" height="1" fill="#efbd7d" opacity="0.22"/>
  <rect x="0" y="76" width="1260" height="2" fill="#000000" opacity="0.28"/>

  <ellipse cx="630" cy="153" rx="625" ry="20" fill="#000000" opacity="0.28" filter="url(#softBlur)"/>
  <rect x="0" y="139" width="1260" height="12" fill="url(#leanStop)" opacity="0.92"/>
  <rect x="0" y="139" width="1260" height="1" fill="#dca76d" opacity="0.24"/>
  <rect x="0" y="150" width="1260" height="2" fill="#000000" opacity="0.34"/>
  <rect x="0" y="151" width="1260" height="9" fill="#000000" opacity="0.19"/>

  <rect x="0" y="156" width="1260" height="50" fill="url(#plank)"/>
  <rect x="0" y="156" width="1260" height="50" fill="url(#horizontalGrain)" opacity="0.88"/>
  <rect x="0" y="153" width="1260" height="7" fill="url(#frontEdge)"/>
  <rect x="0" y="160" width="1260" height="2" fill="#ffffff" opacity="0.09"/>
  <rect x="0" y="174" width="1260" height="32" fill="url(#frontLip)" opacity="0.96"/>
  <rect x="0" y="176" width="1260" height="1" fill="#d7a36b" opacity="0.20"/>
  <rect x="0" y="188" width="1260" height="1" fill="#000000" opacity="0.18"/>
  <rect x="0" y="204" width="1260" height="2" fill="#000000" opacity="0.62"/>
</svg>
